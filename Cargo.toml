[package]
name = "taskmgr"
version = "0.1.0"
edition = "2024"

[[bin]]
# Имя НЕ должно быть taskmgr.exe, иначе подмена через реестр зациклится
name = "TaskMgrRS"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", features = ["glow"] }
egui_extras = "0.37.0"
serde_json = "1.0.154"
sysinfo = "0.40.4"

[target."cfg(windows)".dependencies]
tray-icon = "0.26.1"
windows-link = "0.100.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security"] }
winreg = "0.56.0"

[profile.release]
lto = "thin"
strip = true
